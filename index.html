<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080d">
<title>Scofi — Movies & TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#07080d;--p:#11131c;--p2:#1a1d2a;--ln:#252839;--tx:#f2f3f8;--mu:#8d93a8;--ac:#9b7bff;--ac2:#5de0d2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(ellipse at 50% -10%,#251f40,transparent 50%),var(--bg);color:var(--tx);font:500 15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}h1,h2,h3,h4,p{margin:0}a{color:inherit;text-decoration:none}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.gl{width:42px;height:42px;border-radius:50%;border:1px solid #ffffff2a;background:#0b0c12a8;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;display:grid;place-items:center;padding:0}
.main{max-width:1400px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom))}
body.dt .main{padding-top:0}
/* dock */
.dock{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;display:flex;gap:2px;padding:5px;width:min(80vw,350px);border-radius:999px;background:linear-gradient(135deg,#ffffff2b,#ffffff0a 45%,#ffffff16);backdrop-filter:blur(28px) saturate(1.9) brightness(1.08);-webkit-backdrop-filter:blur(28px) saturate(1.9) brightness(1.08);border:1px solid #ffffff2e;box-shadow:inset 0 1px 0 #ffffff55,inset 0 -1px 0 #ffffff12,0 10px 30px #0009}
.dock button{flex:1;display:grid;justify-items:center;gap:1px;padding:7px 0 5px;border:0;border-radius:999px;background:none;color:#ffffffa6;font-size:10.5px;font-weight:700;transition:background .25s,color .25s}
.dock button.on{background:linear-gradient(180deg,#ffffff3d,#ffffff1a);color:#fff;box-shadow:inset 0 1px 0 #ffffff59,0 2px 10px #9b7bff33}
.dock svg{width:21px;height:21px}
/* hero 16:9 */
.hero{position:relative;aspect-ratio:16/9;border-radius:22px;overflow:hidden;background:var(--p);touch-action:pan-y;cursor:pointer;margin-bottom:6px}
.hero:not([data-id]){background:linear-gradient(90deg,var(--p),var(--p2),var(--p));background-size:200% 100%;animation:sh 1.3s infinite}
.hero .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%;transition:opacity .45s}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#07080df5,#07080d55 52%,transparent),linear-gradient(90deg,#07080dbb,transparent 70%)}
.hc{position:absolute;z-index:2;left:0;bottom:0;padding:clamp(14px,4vw,40px);max-width:75%}
.hlogo{display:block;width:min(100%,170px);max-height:42px;object-fit:contain;object-position:left bottom;margin-bottom:8px;filter:drop-shadow(0 3px 12px #000a)}
.htitle{font-size:clamp(18px,4.8vw,36px);line-height:1.05;font-weight:800;letter-spacing:-.8px;margin-bottom:8px;text-shadow:0 2px 16px #0009}.hm{position:absolute;z-index:3;top:12px;left:12px}.hm .pill{padding:3px 9px;font-size:11px}.pill.y{color:#ffc83d;background:#000a}.pill.v{color:#ff4d4d;background:#000a}.dr{position:absolute;z-index:2;bottom:14px;left:calc(32px + min(33vw,160px));display:flex;gap:7px}.dr .pill{padding:3px 10px;font-size:12px}.still{flex:0 0 240px;aspect-ratio:16/9;object-fit:cover;border-radius:12px;background:var(--p)}.eh{font-size:clamp(24px,6vw,38px);font-weight:800;letter-spacing:-.9px;line-height:1.1;margin-top:4px}[hidden]{display:none!important}[data-full]{cursor:zoom-in}.fact[data-md]{cursor:pointer}.sw{position:relative;margin:6px 0 4px}.sw svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--mu);pointer-events:none}.sw .si{margin:0;padding-left:50px;padding-right:50px}.qx{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;border:0;background:var(--p2);color:var(--tx);display:grid;place-items:center;padding:0}.qx svg{position:static;transform:none;width:16px;height:16px;color:inherit}.lb{position:fixed;inset:0;z-index:100;background:#000e;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center}.lb img{max-width:100%;max-height:100%;object-fit:contain}.lbt{position:absolute;z-index:2;top:calc(12px + env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between}.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sec .sh h2{margin:0}.bar2{display:flex;align-items:center;gap:14px;margin-bottom:18px}.cast{cursor:pointer}.ig{display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:620px){.ig{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}}.ig img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;background:var(--p)}.ig.lg{grid-template-columns:repeat(2,1fr)}.ig.lg img{object-fit:contain;padding:14px;border:1px solid var(--ln)}.dlogo{display:block;max-width:min(100%,200px);max-height:52px;object-fit:contain;object-position:left bottom;margin-bottom:8px;filter:drop-shadow(0 2px 10px #000a)}
.pills{display:flex;flex-wrap:wrap;gap:7px}
.pill{padding:5px 11px;border-radius:99px;background:#ffffff1c;border:1px solid #ffffff22;backdrop-filter:blur(8px);font-size:12.5px;font-weight:700}
.hb{position:absolute;z-index:3;right:12px;bottom:12px;display:flex;gap:7px}.hb .gl{width:36px;height:36px;font-size:20px}
.dots{position:absolute;z-index:3;top:12px;right:14px;display:flex;gap:5px;pointer-events:none}
.dots i{width:5px;height:5px;border-radius:9px;background:#fff6;transition:width .3s,background .3s}.dots i.on{width:18px;background:#fff}
/* chips + grid */
.ph{font-size:30px;font-weight:800;letter-spacing:-1px;margin:8px 0 2px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:16px -16px 18px;padding:0 16px}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 16px;border-radius:99px;border:1px solid var(--ln);background:var(--p);color:var(--mu);font-weight:700}
.chip.on{background:var(--tx);color:#0a0a10;border-color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}
@media(min-width:620px){.grid{grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:22px 16px}}
.cd{content-visibility:auto;contain-intrinsic-size:auto 290px;cursor:pointer;min-width:0}
.pw{position:relative;aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:var(--p)}
.pw img{width:100%;height:100%;object-fit:cover;display:block}
.rt{position:absolute;top:8px;left:8px;padding:3px 9px;border-radius:99px;background:#000a;backdrop-filter:blur(8px);font-size:12px;font-weight:800}
.cd h3{margin:9px 2px 1px;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd p{margin:0 2px;color:var(--mu);font-size:12.5px}
.sk{border-radius:14px;aspect-ratio:2/3;background:linear-gradient(90deg,var(--p),var(--p2),var(--p));background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}
.end{text-align:center;color:var(--mu);padding:28px 0 6px;font-size:13.5px}
.si{width:100%;margin:10px 0 20px;padding:15px 18px;border-radius:99px;border:1px solid var(--ln);background:var(--p);color:#fff;font:inherit;font-size:16px;outline:none}.si:focus{border-color:var(--ac)}
/* detail */
.dh{position:relative;aspect-ratio:16/9;max-height:62vh;margin:0 -16px;background:var(--p)}
.dh img{width:100%;height:100%;object-fit:cover;display:block}
.dh:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg),transparent 55%),linear-gradient(180deg,#07080d99,transparent 30%)}
.dbar{position:absolute;z-index:2;top:calc(12px + env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between}
.dtop{display:flex;gap:16px;align-items:flex-end;margin-top:-62px;position:relative;z-index:1}
.dp{width:min(33vw,160px);aspect-ratio:2/3;object-fit:cover;border-radius:14px;border:1px solid #ffffff24;box-shadow:0 14px 34px #000c;flex:none;background:var(--p)}
.dtop h1{font-size:clamp(23px,6vw,40px);line-height:1.08;font-weight:800;letter-spacing:-.9px;margin-bottom:6px}
.sub{color:var(--mu);font-size:13.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:14px;font-weight:800;border:1px solid transparent}
.btn.pr{background:#fff;color:#0a0a10}.btn.sc{background:var(--p2);border-color:var(--ln)}.btn.sc.on{border-color:var(--ac);color:var(--ac)}
.btn svg{width:18px;height:18px}.btn.pr svg{fill:#0a0a10;stroke:none}
.sec{margin-top:28px}.sec h2{font-size:19px;font-weight:800;letter-spacing:-.4px;margin-bottom:12px}
.ov{color:#cfd2df;line-height:1.65;max-width:70ch}.ov.cl{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.lnk{background:none;border:0;color:var(--ac);font-weight:700;padding:6px 0}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:620px){.facts{grid-template-columns:repeat(4,1fr)}}
.fact{background:var(--p);border:1px solid var(--ln);border-radius:14px;padding:12px 14px}.fact small{display:block;color:var(--mu);font-size:12px}.fact b{font-size:14px}
.row{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}.row::-webkit-scrollbar{display:none}
.row .cd{flex:0 0 128px}
.cast{flex:0 0 82px;text-align:center;font-size:12px;line-height:1.3}.cast img{width:70px;height:70px;border-radius:50%;object-fit:cover;background:var(--p);margin-bottom:6px}.cast span{display:block;color:var(--mu)}
.ep{display:flex;gap:12px;padding:13px 0;border-top:1px solid var(--ln);cursor:pointer}
.ep img{width:128px;aspect-ratio:16/9;object-fit:cover;border-radius:10px;flex:none;background:var(--p)}
.ep h4{font-size:14.5px;margin-bottom:2px}.ep p{color:var(--mu);font-size:13px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.err{padding:22px;border:1px solid var(--ln);border-radius:16px;background:var(--p);color:var(--mu)}.err b{color:var(--tx)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="m" class="main"></main>
<nav class="dock" id="dock" aria-label="Main navigation"></nav>
<div id="lb" class="lb" hidden><div class="lbt"><button class="gl" id="lbx" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button><button class="gl" id="lbd" aria-label="Download image"><svg viewBox="0 0 24 24"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 19.5h14"/></svg></button></div><img id="lbi" alt=""></div>
<script>
const KEY="0d516ae53b334d92b86cfc7c958d192f",API="https://api.themoviedb.org/3",IMG="https://image.tmdb.org/t/p/";
const PH="data:image/svg+xml;charset=UTF-8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900"><rect width="600" height="900" fill="#1a1d2a"/><circle cx="300" cy="400" r="70" fill="#272b3f"/><text x="300" y="540" fill="#8d93a8" font-family="Arial" font-size="26" text-anchor="middle">No image</text></svg>');
const P={home:'<path d="m3 10.5 9-7 9 7"/><path d="M5.5 9.5V20h13V9.5M10 20v-6h4v6"/>',movie:'<rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M8 3v18M16 3v18M4 8h4M4 12h4M4 16h4M16 8h4M16 12h4M16 16h4"/>',tv:'<rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="m8 2.5 4 3.5 4-3.5"/>',search:'<circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/>',mark:'<path d="M6 3.5h12v17l-6-4.5-6 4.5z"/>',back:'<path d="m15 5-7 7 7 7"/>',play:'<path d="M7 4.5v15l12-7.5z"/>',close:'<path d="M6 6l12 12M18 6 6 18"/>'};
const I=k=>`<svg viewBox="0 0 24 24" aria-hidden="true">${P[k]}</svg>`;
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const img=(p,s="w342")=>p?IMG+s+p:PH,yr=v=>v?String(v).slice(0,4):"TBA",rate=v=>Number(v)>0?"★ "+Number(v).toFixed(1):"☆ NR";
const ttl=x=>x.title||x.name||"Untitled",mdt=x=>x.release_date||x.first_air_date,mt=x=>x.media_type||(x.title?"movie":"tv");
const dstr=v=>{if(!v)return"TBA";const d=new Date(v+"T12:00:00");return isNaN(d)?"TBA":d.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"})};
const S={cache:new Map(),route:"",pushes:0,ds:{},mode:{home:"trending",movie:"popular",tv:"popular",search:"trending"},logos:new Map()};
const H={items:[],i:0,timer:0,tok:0,sw:false},feeds={};let cur=null,io=null;
async function api(path,q={}){const k=path+"?"+new URLSearchParams(q);if(S.cache.has(k))return S.cache.get(k);const u=new URL(API+path);u.searchParams.set("api_key",KEY);for(const[a,b]of Object.entries(q))if(b!=null&&b!=="")u.searchParams.set(a,b);const r=await fetch(u);if(!r.ok){let m="TMDB request failed ("+r.status+")";try{m=(await r.json()).status_message||m}catch{}throw Error(m)}const d=await r.json();S.cache.set(k,d);return d}
const err=e=>`<div class="err"><b>Couldn’t load TMDB data.</b><p>${esc(e.message)}</p><p>Check your connection and API key, then try again.</p></div>`;
/* cards */
const card=x=>{const t=mt(x),n=ttl(x);return `<article class="cd" tabindex="0" role="button" aria-label="Open ${esc(n)}" data-o="${t}" data-id="${x.id}"><div class="pw"><img loading="lazy" decoding="async" src="${img(x.poster_path)}" alt="${esc(n)} poster" onerror="this.src=PH"><span class="rt">${rate(x.vote_average)}</span></div><h3>${esc(n)}</h3><p>${yr(mdt(x))} · ${t==="movie"?"Movie":"TV"}</p></article>`};
const sk=()=>`<div class="grid">${'<div class="sk"></div>'.repeat(4)}</div>`;
/* infinite feed */
const PATH={popular:{movie:"/movie/popular",tv:"/tv/popular"},trending:{movie:"/trending/movie/week",tv:"/trending/tv/week"},top:{movie:"/movie/top_rated",tv:"/tv/top_rated"},fresh:{movie:"/movie/now_playing",tv:"/tv/on_the_air"}};
const kindOf=r=>r==="home"||r==="search"?["movie","tv"]:[r];
const fetcher=(route,mode)=>async p=>{const rs=await Promise.all(kindOf(route).map(k=>api(PATH[mode][k],{language:"en-US",page:p}).then(d=>({k,d}))));const items=[],n=Math.max(...rs.map(r=>r.d.results.length));for(let i=0;i<n;i++)rs.forEach(r=>{const x=r.d.results[i];if(x)items.push({...x,media_type:r.k})});return{items,more:rs.some(r=>p<Math.min(r.d.total_pages,500))}};
function mount(key,fetch){
  io&&io.disconnect();
  const f=feeds[key]||(feeds[key]={ids:new Set(),html:"",page:0,done:false,busy:false,y:0});cur=f;
  const g=$("#grid"),s=$("#sent");g.innerHTML=f.html;
  const endMsg=()=>`<p class="end">${f.html?"That’s every title in this list.":"No titles found."}</p>`;
  s.innerHTML=f.done?endMsg():sk();
  if(f.y)requestAnimationFrame(()=>scrollTo(0,f.y));
  const more=async()=>{
    if(f.busy||f.done)return;f.busy=true;
    try{
      const r=await fetch(f.page+1);f.page++;
      const it=r.items.filter(x=>x.poster_path&&!f.ids.has(mt(x)+x.id));it.forEach(x=>f.ids.add(mt(x)+x.id));
      const h=it.map(card).join("");f.html+=h;if(cur===f)g.insertAdjacentHTML("beforeend",h);
      if(!r.more){f.done=true;if(cur===f)s.innerHTML=endMsg()}
    }catch(e){f.busy=false;if(cur===f)s.innerHTML=`<p class="end"><button class="btn sc" id="retry">Couldn’t load more. Tap to retry</button></p>`;return}
    f.busy=false;
    if(cur===f&&!f.done&&s.getBoundingClientRect().top<innerHeight+1400)more();
  };
  f.more=more;
  io=new IntersectionObserver(e=>e[0].isIntersecting&&more(),{rootMargin:"1400px"});io.observe(s);
}
function feedPage(route,pre=""){
  const m=S.mode[route],lab={fresh:route==="tv"?"On air":route==="movie"?"In theatres":"New"};
  $("#m").innerHTML=`${pre}<div class="chips">${[["trending","Trending"],["popular","Popular"],["top","Top rated"],["fresh","New"]].map(([k,l])=>`<button class="chip${k===m?" on":""}" data-mode="${k}">${lab[k]||l}</button>`).join("")}</div><div id="grid" class="grid"></div><div id="sent"></div>`;
  mount(route+":"+m,fetcher(route,m));
}
/* hero */
async function logo(it){const k=mt(it)+it.id;if(S.logos.has(k))return S.logos.get(k);let r=null;try{const d=await api(`/${mt(it)}/${it.id}/images`);const l=(d.logos||[]).filter(x=>x.file_path).sort((a,b)=>((a.iso_639_1==="en"?0:a.iso_639_1?2:1)-(b.iso_639_1==="en"?0:b.iso_639_1?2:1))||(b.vote_average||0)-(a.vote_average||0))[0];if(l)r=img(l.file_path,"w500")}catch{}S.logos.set(k,r);return r}
function showHero(n){
  const L=H.items.length,hero=$("#hero");if(!L||!hero)return;H.i=(n+L)%L;const it=H.items[H.i],tok=++H.tok;
  hero.dataset.o=mt(it);hero.dataset.id=it.id;
  const im=hero.querySelector(".bg");im.style.opacity=0;im.onload=()=>im.style.opacity=1;im.src=img(it.backdrop_path,"w1280");
  hero.querySelectorAll(".dots i").forEach((d,i)=>d.classList.toggle("on",i===H.i));
  $("#hm").innerHTML=`<span class="pill y">${rate(it.vote_average)}</span><span class="pill">${mt(it)==="movie"?"Movie":"TV"} · ${yr(mdt(it))}</span>`;
  const tx=`<h2 class="htitle">${esc(ttl(it))}</h2>`;$("#hl").innerHTML=tx;
  logo(it).then(u=>{if(!u||tok!==H.tok)return;const i=new Image();i.className="hlogo";i.alt=ttl(it);i.onload=()=>{if(tok===H.tok&&$("#hl"))$("#hl").replaceChildren(i)};i.src=u});
}
const tick=()=>{clearInterval(H.timer);H.timer=setInterval(()=>!document.hidden&&showHero(H.i+1),5000)};
async function loadHero(){
  try{const d=await api("/trending/all/week",{language:"en-US"});const hero=$("#hero");if(!hero)return;
    H.items=d.results.filter(x=>x.backdrop_path&&["movie","tv"].includes(x.media_type)).slice(0,8);if(!H.items.length)return hero.remove();
    hero.innerHTML=`<img class="bg" alt=""><div class="dots">${H.items.map(()=>"<i></i>").join("")}</div><div id="hm" class="pills hm"></div><div class="hc"><div id="hl"></div></div><div class="hb"><button class="gl" id="hp" aria-label="Previous">‹</button><button class="gl" id="hn" aria-label="Next">›</button></div>`;
    showHero(0);tick();let x0=0;
    hero.addEventListener("touchstart",e=>x0=e.touches[0].clientX,{passive:true});
    hero.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>40){H.sw=true;setTimeout(()=>H.sw=false,350);showHero(H.i+(dx<0?1:-1));tick()}});
  }catch{$("#hero")?.remove()}
}
/* pages */
const home=()=>{feedPage("home",'<section class="hero" id="hero" aria-label="Trending this week"></section>');loadHero()};
function search(q=""){
  const ch=[["trending","Trending"],["popular","Popular"],["top","Top rated"],["fresh","New"]].map(([k,l])=>`<button class="chip${k===S.mode.search?" on":""}" data-mode="${k}">${l}</button>`).join("");
  $("#m").innerHTML=`<div class="sw">${I("search")}<input id="q" class="si" type="search" placeholder="Search movies and TV shows" value="${esc(q)}" autocomplete="off" enterkeyhint="search"><button id="qx" class="qx" aria-label="Clear search"${q?"":" hidden"}>${I("close")}</button></div><div class="chips" id="sc"${q?" hidden":""}>${ch}</div><div id="grid" class="grid"></div><div id="sent"></div>`;
  if(q)runSearch(q);else browse();
}
const browse=()=>{const m=S.mode.search;mount("search:"+m,fetcher("search",m))};
const runSearch=q=>mount("s:"+q,async p=>{const d=await api("/search/multi",{query:q,include_adult:false,language:"en-US",page:p});return{items:d.results.filter(x=>x.media_type==="movie"||x.media_type==="tv"),more:p<Math.min(d.total_pages,500)}});
async function detail(type,id){
  const m=$("#m");m.innerHTML='<div class="dh"></div>';
  try{
    const d=await api(`/${type}/${id}`,{language:"en-US",append_to_response:"credits,recommendations"});

<div class="dtop"><img class="dp" data-full="${d.poster_path||""}" src="${img(d.poster_path)}" alt="${esc(t)} poster" onerror="this.src=PH"><div><div id="dl"><h1>${esc(t)}</h1></div><p class="sub">${yr(dt)}${rt?" · "+rt+" min":""} · ${type==="movie"?"Movie":"TV series"}</p></div></div>

${castSec(cast,{t:type,id:d.id})}
${type==="tv"&&seasons.length?`<div class="sec"><h2>Episodes</h2><div class="chips" id="ss" style="margin-top:0">${seasons.map((s,i)=>`<button class="chip${i?"":" on"}" data-s="${s.season_number}">${esc(s.name)}</button>`).join("")}</div><div id="eps"></div></div>`:""}

    logo({id:d.id,media_type:type}).then(u=>{if(!u)return;const i=new Image();i.className="dlogo";i.alt=t;i.onload=()=>{const b=$("#dl");if(b&&window.CUR&&CUR.d===d)b.replaceChildren(i)};i.src=u});const st=S.ds[type+d.id];delete S.ds[type+d.id];if(type==="tv"&&seasons.length){const s0=st&&seasons.some(x=>x.season_number==st.s)?st.s:seasons[0].season_number;if(st)document.querySelectorAll("[data-s]").forEach(x=>x.classList.toggle("on",x.dataset.s==s0));CUR.season=s0;eps(d.id,s0).then(()=>st&&scrollTo(0,st.y))}else if(st)scrollTo(0,st.y);
  }catch(e){m.innerHTML=`<div style="padding-top:calc(20px + env(safe-area-inset-top))"><button class="gl" id="bk" aria-label="Back" style="margin-bottom:16px">${I("back")}</button>${err(e)}</div>`}

async function eps(id,n){const b=$("#eps");b.innerHTML='<p class="end">Loading episodes…</p>';try{const d=await api(`/tv/${id}/season/${n}`,{language:"en-US"});if($("#eps")!==b)return;b.innerHTML=d.episodes?.length?d.episodes.map(e=>`<article class="ep" tabindex="0" role="button" data-ep="${e.episode_number}" data-sn="${n}"><img loading="lazy" src="${img(e.still_path,"w300")}" alt="" onerror="this.src=PH"><div><h4>${e.episode_number}. ${esc(e.name||"Untitled episode")}</h4><p class="sub">${dstr(e.air_date)}${e.runtime?" · "+e.runtime+" min":""} · ${rate(e.vote_average)}</p><p>${esc(e.overview||"No description available.")}</p></div></article>`).join(""):'<p class="end">No episode details for this season yet.</p>'}catch(e){b.innerHTML=err(e)}}
async function episode(id,s,n){
  const m=$("#m");m.innerHTML='<div class="dh"></div>';

    const e=await api(`/tv/${id}/season/${s}/episode/${n}`,{language:"en-US",append_to_response:"images,credits",include_image_language:"en,null"});
    const st=e.images?.stills||[],seen=new Set(),cast=[...(e.credits?.cast||[]),...(e.guest_stars||[]),...(e.credits?.guest_stars||[])].filter(c=>c.id&&!seen.has(c.id)&&seen.add(c.id));

<div style="position:relative;z-index:1;margin-top:-34px"><p class="sub">Season ${esc(s)} · Episode ${esc(n)}</p><h1 class="eh">${esc(e.name||"Untitled episode")}</h1><div class="pills" style="margin-top:12px"><span class="pill y">${rate(e.vote_average)}</span><span class="pill">${dstr(e.air_date)}</span>${e.runtime?`<span class="pill">${e.runtime} min</span>`:""}</div></div>
<div class="sec"><h2>Overview</h2><p class="ov">${esc(e.overview||"No description available for this episode yet.")}</p></div>
${castSec(cast,{t:"tv",id,s,e:n})}
<div class="sec"><div class="sh"><h2>Images</h2><button class="lnk" data-im="${esc(JSON.stringify({id,s,e:n}))}">View all</button></div>${st.length>1?`<div class="row">${st.map(x=>`<img class="still" data-full="${x.file_path}" loading="lazy" src="${img(x.file_path,"w500")}" alt="">`).join("")}</div>`:""}</div>`;
  }catch(x){m.innerHTML=`<div style="padding-top:calc(20px + env(safe-area-inset-top))"><button class="gl" id="bk" aria-label="Back" style="margin-bottom:16px">${I("back")}</button>${err(x)}</div>`}

const castItem=c=>`<div class="cast" data-p="${c.id}" tabindex="0" role="button"><img loading="lazy" src="${img(c.profile_path,"w185")}" alt="" onerror="this.src=PH"><b>${esc(c.name)}</b><span>${esc(c.character||"")}</span></div>`;
const castSec=(l,ctx)=>l.length?`<div class="sec"><div class="sh"><h2>Cast</h2><button class="lnk" data-ca="${esc(JSON.stringify(ctx))}">View all</button></div><div class="row">${l.slice(0,16).map(castItem).join("")}</div></div>`:"";
const bar=(t,sub)=>`<div class="bar2"><button class="gl" id="bk" aria-label="Back">${I("back")}</button><div><h1 class="ph" style="margin:0">${t}</h1>${sub?`<p class="sub">${sub}</p>`:""}</div></div>`;
async function castPage(p){
  const m=$("#m");m.innerHTML=bar("Cast")+'<p class="end">Loading cast…</p>';
  try{
    let l;
    if(p.t==="movie")l=(await api(`/movie/${p.id}/credits`,{language:"en-US"})).cast||[];
    else if(p.e!=null){const e=await api(`/tv/${p.id}/season/${p.s}/episode/${p.e}`,{language:"en-US",append_to_response:"credits"}),seen=new Set();l=[...(e.credits?.cast||[]),...(e.guest_stars||[]),...(e.credits?.guest_stars||[])].filter(c=>c.id&&!seen.has(c.id)&&seen.add(c.id))}
    else l=((await api(`/tv/${p.id}/aggregate_credits`,{language:"en-US"})).cast||[]).sort((a,b)=>(a.order??999)-(b.order??999)).map(c=>({...c,character:c.roles?.[0]?.character}));
    m.innerHTML=bar("Cast",l.length+" people")+(l.length?`<div class="grid">${l.map(c=>`<article class="cd" tabindex="0" role="button" data-p="${c.id}"><div class="pw"><img loading="lazy" decoding="async" src="${img(c.profile_path,"w342")}" alt="" onerror="this.src=PH"></div><h3>${esc(c.name)}</h3><p>${esc(c.character||"")}</p></article>`).join("")}</div>`:'<p class="end">No cast information yet.</p>');
  }catch(x){m.innerHTML=bar("Cast")+err(x)}
}
async function person(id){
  const m=$("#m");m.innerHTML=bar("Profile")+'<p class="end">Loading profile…</p>';
  try{
    const d=await api(`/person/${id}`,{language:"en-US",append_to_response:"combined_credits"}),cc=d.combined_credits||{},seen=new Set();
    let L=cc.cast||[];if(!L.length)L=cc.crew||[];
    L=L.filter(x=>x.poster_path&&["movie","tv"].includes(x.media_type)&&!seen.has(x.media_type+x.id)&&seen.add(x.media_type+x.id)).sort((a,b)=>(b.popularity||0)-(a.popularity||0));
    const nm=L.filter(x=>x.media_type==="movie").length,nt=L.length-nm,k0=nm||!nt?"movie":"tv";
    let age="";if(d.birthday){const[by,bm,bd]=d.birthday.split("-").map(Number),e=d.deathday?new Date(d.deathday+"T12:00:00"):new Date();let a=e.getFullYear()-by;if(e.getMonth()+1<bm||(e.getMonth()+1===bm&&e.getDate()<bd))a--;if(a>=0)age=a}
    const F=[["Born",d.birthday?dstr(d.birthday):""],d.deathday?["Died",dstr(d.deathday)+(age!==""?" (aged "+age+")":"")]:["Age",age!==""?age+" years":""],["Birthplace",d.place_of_birth],["Known for",d.known_for_department]].filter(f=>f[1]),long=(d.biography||"").length>240;
    m.innerHTML=`${bar("Profile")}<div class="dtop" style="margin-top:6px;align-items:flex-start"><img class="dp" data-full="${d.profile_path||""}" src="${img(d.profile_path,"w500")}" alt="${esc(d.name)}" onerror="this.src=PH"><div><h1 class="eh">${esc(d.name)}</h1></div></div>
${F.length?`<div class="sec"><div class="facts">${F.map(f=>`<div class="fact"><small>${f[0]}</small><b>${esc(f[1])}</b></div>`).join("")}</div></div>`:""}
${d.biography?`<div class="sec"><h2>Biography</h2><p class="ov${long?" cl":""}" id="ov" style="white-space:pre-line">${esc(d.biography)}</p>${long?'<button class="lnk" data-more>Read more</button>':""}</div>`:""}
${L.length?`<div class="sec"><h2>Filmography</h2><div class="chips" style="margin-top:0">${nm?`<button class="chip${k0==="movie"?" on":""}" data-pf="movie">Movies (${nm})</button>`:""}${nt?`<button class="chip${k0==="tv"?" on":""}" data-pf="tv">TV Shows (${nt})</button>`:""}</div><div class="grid" id="pg">${L.map(card).join("")}</div></div>`:""}`;
    document.querySelectorAll("#pg .cd").forEach(c=>c.hidden=c.dataset.o!==k0);
  }catch(x){m.innerHTML=bar("Profile")+err(x)}
}
const igHtml=t=>t[0]==="Posters"?`<div class="grid">${t[1].map(x=>`<div class="pw"><img data-full="${x.file_path}" loading="lazy" src="${img(x.file_path,t[2])}" alt=""></div>`).join("")}</div>`:`<div class="ig${t[0]==="Logos"?" lg":""}">${t[1].map(x=>`<img data-full="${x.file_path}" loading="lazy" src="${img(x.file_path,t[2])}" alt="">`).join("")}</div>`;
async function images(id,s,e){
  const m=$("#m");m.innerHTML=bar("Images")+'<p class="end">Loading images…</p>';
  try{
    const q={include_image_language:"en,null"},[a,b]=await Promise.all([api(`/tv/${id}/season/${s}/episode/${e}/images`,q),api(`/tv/${id}/images`,q)]);
    const T=[["Episode",a.stills||[],"w780"],["Backdrops",b.backdrops||[],"w780"],["Posters",b.posters||[],"w342"],["Logos",b.logos||[],"w300"]].filter(t=>t[1].length);

const lbSet=on=>{$("#lb").hidden=!on;document.body.style.overflow=on?"hidden":""};
let LB="";
function openLB(p){LB=p;const i=$("#lbi"),o=new Image();i.src=IMG+"w1280"+p;o.onload=()=>{if(LB===p)i.src=o.src};o.src=IMG+"original"+p;lbSet(true);history.pushState({lb:1},"",location.href)}

async function dl(){const u=IMG+"original"+LB;try{const r=await fetch(u);if(!r.ok)throw 0;const a=document.createElement("a");a.href=URL.createObjectURL(await r.blob());a.download="scofi"+LB.replace("/","-");document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}catch{window.open(u,"_blank")}}
async function media(t,id){
  const m=$("#m");m.innerHTML=bar("Media")+'<p class="end">Loading images…</p>';
  try{
    const b=await api(`/${t}/${id}/images`,{include_image_language:"en,null"});

    m.innerHTML=bar("Media")+(T.length?`<div class="chips" style="margin-top:0">${T.map((x,i)=>`<button class="chip${i?"":" on"}" data-it="${i}">${x[0]} (${x[1].length})</button>`).join("")}</div><div id="ig">${igHtml(T[0])}</div>`:'<p class="end">No images available for this title yet.</p>');

/* router */
function parse(){const r=location.hash.replace(/^#/,"");if(!r)return{r:"home",p:{}};const i=r.indexOf("/");if(i<0)return{r,p:{}};try{return{r:r.slice(0,i),p:JSON.parse(decodeURIComponent(r.slice(i+1)))}}catch{return{r:r.slice(0,i),p:{}}}}
function go(r,p={},rep){
  if(!rep&&r===S.route&&r!=="detail"&&r!=="search"){scrollTo({top:0,behavior:"smooth"});return}
  if(cur)cur.y=scrollY;if(S.route==="detail"&&window.CUR)S.ds[CUR.type+CUR.d.id]={s:CUR.season,y:scrollY};
  const u=new URL(location.href);u.hash=r+(Object.keys(p).length?"/"+encodeURIComponent(JSON.stringify(p)):"");
  if(rep)history.replaceState({r,p},"",u);else{history.pushState({r,p},"",u);S.pushes++}
  render(r,p);
}
function render(r,p={}){
  clearInterval(H.timer);io&&io.disconnect();cur=null;S.route=r;
  document.body.classList.toggle("dt",r==="detail"||r==="episode");
  document.querySelectorAll("#dock button").forEach(b=>b.classList.toggle("on",b.dataset.r===r));
  if(!["home","movie","tv"].includes(r))scrollTo(0,0);
  if(r==="home")home();else if(r==="movie"||r==="tv")feedPage(r,`<h1 class="ph">${r==="movie"?"Movies":"TV Shows"}</h1>`);
  else if(r==="search")search(p.q||"");else if(r==="detail")detail(p.type||"movie",p.id);else if(r==="episode")episode(p.id,p.s,p.e);else if(r==="cast")castPage(p);else if(r==="person")person(p.id);else if(r==="images")images(p.id,p.s,p.e);else if(r==="media")media(p.t,p.id);else go("home",{},true);
}
/* events */
$("#dock").innerHTML=[["home","Home","home"],["movie","Movies","movie"],["tv","TV","tv"],["search","Search","search"]].map(([r,l,i])=>`<button data-r="${r}" aria-label="${l}">${I(i)}<span>${l}</span></button>`).join("");
document.addEventListener("click",e=>{
  const t=e.target;let b;
  if(b=t.closest("[data-r]"))return go(b.dataset.r);
  if(t.closest("#hp")){showHero(H.i-1);return tick()}
  if(t.closest("#hn")){showHero(H.i+1);return tick()}
  if(t.closest("#retry")){$("#sent").innerHTML=sk();return cur?.more?.()}
  if(t.closest("#bk"))return S.pushes>0?(S.pushes--,history.back()):go("home");
  if(t.closest("#lbx")||t.id==="lb")return closeLB();
  if(t.closest("#lbd"))return dl();
  if(t.closest("#qx")){const i=$("#q");i.value="";i.focus();return onQ("")}
  if((b=t.closest("[data-full]"))&&b.dataset.full)return openLB(b.dataset.full);
  if(b=t.closest("[data-md]"))return go("media",JSON.parse(b.dataset.md));
  if(b=t.closest("[data-more]")){$("#ov").classList.remove("cl");b.remove();return}
  if(b=t.closest("[data-s]")){document.querySelectorAll("[data-s]").forEach(x=>x.classList.toggle("on",x===b));CUR.season=b.dataset.s;return eps(CUR.d.id,b.dataset.s)}
  if(b=t.closest("[data-ep]"))return go("episode",{id:CUR.d.id,s:b.dataset.sn,e:b.dataset.ep});
  if(b=t.closest("[data-ca]"))return go("cast",JSON.parse(b.dataset.ca));
  if(b=t.closest("[data-im]"))return go("images",JSON.parse(b.dataset.im));
  if(b=t.closest("[data-p]"))return go("person",{id:b.dataset.p});
  if(b=t.closest("[data-pf]")){document.querySelectorAll("[data-pf]").forEach(x=>x.classList.toggle("on",x===b));document.querySelectorAll("#pg .cd").forEach(c=>c.hidden=c.dataset.o!==b.dataset.pf);return}
  if(b=t.closest("[data-it]")){document.querySelectorAll("[data-it]").forEach(x=>x.classList.toggle("on",x===b));$("#ig").innerHTML=igHtml(window.IG[b.dataset.it]);return}
  if(b=t.closest("[data-mode]")){const r=S.route;S.mode[r]=b.dataset.mode;document.querySelectorAll("[data-mode]").forEach(x=>x.classList.toggle("on",x===b));const c=$(".chips"),y=c.getBoundingClientRect().top+scrollY-70;if(scrollY>y)scrollTo(0,y);return mount(r+":"+b.dataset.mode,fetcher(r,b.dataset.mode))}
  if(b=t.closest("[data-o]")){if(H.sw&&b.id==="hero")return;delete S.ds[b.dataset.o+b.dataset.id];go("detail",{type:b.dataset.o,id:b.dataset.id})}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#lb").hidden)return closeLB();if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-o],[data-ep],[data-p],[data-md]")){e.preventDefault();e.target.click()}});
let qt;const onQ=v=>{clearTimeout(qt);$("#qx").hidden=!v;qt=setTimeout(()=>{const q=v.trim();history.replaceState({r:"search",p:{q}},"","#search"+(q?"/"+encodeURIComponent(JSON.stringify({q})):""));if(q.length>1){$("#sc").hidden=true;runSearch(q)}else{$("#sc").hidden=false;browse()}},350)};
document.addEventListener("input",e=>{if(e.target.id==="q")onQ(e.target.value)});
addEventListener("popstate",()=>{if(S.skip){S.skip=false;return}if(!$("#lb").hidden){lbSet(false);return}const x=parse();render(x.r,x.p)});
history.scrollRestoration="manual";
const first=parse();if(!location.hash)history.replaceState({r:"home",p:{}},"",location.pathname+location.search+"#home");render(first.r,first.p);
