<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0b12">
<title>CineScope — Movie & TV Discovery</title>
<style>
:root{color-scheme:dark;--bg:#090a10;--panel:#131521;--panel2:#191c2b;--text:#f6f7fb;--muted:#9ba1b5;--accent:#9b7bff;--accent2:#5de0d2;--line:#292c3b;--radius:17px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#25203e 0,transparent 55%),var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.app{max-width:1500px;margin:auto;min-height:100vh}

.topbar{position:sticky;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;gap:12px;padding:18px clamp(14px,3.5vw,64px) 10px;background:linear-gradient(180deg,#090a10f0 60%,transparent);backdrop-filter:blur(10px)}
.nav{display:flex;gap:8px;align-items:center;padding:7px;background:#34323b9c;border:1px solid #ffffff25;border-radius:40px;box-shadow:0 8px 28px #0003;backdrop-filter:blur(18px)}
.nav button{border:0;background:transparent;color:#e0dfe4;padding:10px 19px;border-radius:30px;font-weight:700}
.nav button.active{color:#111;background:#fff;box-shadow:0 2px 8px #0002}
.nav button.active,.nav button:hover{color:white;background:#9b7bff25}
.search-icon{width:46px;height:46px;flex:0 0 46px;display:grid;place-items:center;border:1px solid #ffffff2b;border-radius:50%;background:#34323b9c;color:#fff;backdrop-filter:blur(18px);box-shadow:0 8px 28px #0003;transition:background .18s,transform .18s}
.search-icon:hover{background:#9b7bff55;transform:scale(1.04)}
.search-icon svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.main{padding:15px clamp(14px,3vw,38px) 80px}.page-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:10px 0 20px}.eyebrow{color:var(--accent2);text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:800}.page-head h1{font-size:clamp(27px,4vw,42px);letter-spacing:-1.4px;margin:4px 0}.sub{color:var(--muted);margin:0}

.hero{position:relative;width:100%;aspect-ratio:16/9;max-height:75vh;min-height:360px;display:flex;align-items:flex-end;overflow:hidden;border-radius:16px;background:#202337;margin:10px 0 30px;cursor:pointer;transition:opacity .15s}
.hero:hover{opacity:.97}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 35%;opacity:.96}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#090a10ea 0%,#090a1055 50%,transparent 100%),linear-gradient(90deg,#090a10cc 0%,transparent 70%)}
.hero-content{position:relative;z-index:1;padding:clamp(20px,4vw,45px);max-width:900px;width:100%}
.hero-title-slot{margin-bottom:12px}
.hero-title-logo{display:block;width:min(420px,50vw);max-height:130px;object-fit:contain;object-position:left bottom;filter:drop-shadow(0 3px 14px #0008)}
.hero-title-text{font-size:clamp(32px,4.5vw,60px);line-height:1.02;font-weight:950;letter-spacing:-2px;margin:0;color:#fff;text-shadow:0 3px 22px #0008}

.hero-nav-controls{position:absolute;right:25px;bottom:25px;z-index:3;display:flex;gap:8px}
.hero-nav-btn{background:#34323bba;border:1px solid #ffffff30;color:#fff;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:16px;font-weight:bold;backdrop-filter:blur(10px);transition:background .2s,transform .2s}
.hero-nav-btn:hover{background:#9b7bffaa;transform:scale(1.08)}

.pills{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:#fff}
.pill{background:#ffffff18;border:1px solid #ffffff24;padding:4px 10px;border-radius:99px;font-size:13px;font-weight:700}

.section{margin:28px 0}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}.section-title h2{font-size:20px;margin:0;letter-spacing:-.4px}.section-title span{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:17px}.card{min-width:0;cursor:pointer;transition:transform .18s}.card:hover{transform:translateY(-4px)}
.poster-wrap{position:relative;overflow:hidden;background:var(--panel);border-radius:13px;aspect-ratio:2/3;border:1px solid #ffffff10}
.poster-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.rating{position:absolute;left:8px;top:8px;background:#090a10d9;border:1px solid #ffffff25;border-radius:8px;padding:4px 7px;font-size:11px;font-weight:800}
.card h3{font-size:14px;line-height:1.3;margin:9px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:var(--muted)}

.landscape-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}
.land-card{cursor:pointer;overflow:hidden;background:var(--panel);border:1px solid #ffffff0c;border-radius:14px}
.land-card img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--panel2)}.land-info{padding:12px}.land-info h3{margin:0 0 5px;font-size:15px}

.empty,.loading,.error{padding:35px 15px;text-align:center;color:var(--muted);background:#ffffff05;border:1px dashed var(--line);border-radius:16px}.error{color:#ffb9c2}
.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:20px}.filters select,.filters button{background:var(--panel);border:1px solid var(--line);color:white;border-radius:10px;padding:9px 12px}.filters button.active{background:var(--accent);border-color:var(--accent)}

.detail-hero{position:relative;min-height:270px;display:flex;align-items:end;overflow:hidden;border-radius:20px;background:var(--panel);margin-bottom:24px}
.detail-hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.46}
.detail-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg),transparent 90%),linear-gradient(90deg,#090a10d9,transparent)}
.detail-copy{position:relative;z-index:1;padding:clamp(18px,4vw,36px);max-width:850px}.detail-copy h1{font-size:clamp(30px,5vw,48px);line-height:1.05;margin:8px 0}
.detail-layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:25px}.detail-poster{width:100%;border-radius:14px}.overview{color:#c4c7d4;max-width:850px}
.season-select{background:var(--panel);color:white;border:1px solid var(--line);padding:10px;border-radius:10px;max-width:100%;margin:8px 0 16px}
.episode-list{display:grid;gap:12px}
.episode{display:grid;grid-template-columns:190px minmax(0,1fr);gap:14px;background:var(--panel);padding:10px;border-radius:13px;border:1px solid #ffffff0c}
.episode img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:9px;background:var(--panel2)}.episode h3{margin:2px 0 7px;font-size:16px}.episode p{margin:6px 0;color:var(--muted);font-size:13px}
.backbtn{background:var(--panel);border:1px solid var(--line);color:white;border-radius:10px;padding:9px 12px;margin-bottom:15px}

/* Floating Mobile Navigation Bar (Image 2 Style) */
.mobile-nav{display:none}

.footer{text-align:center;color:#777d91;padding:25px 12px 40px;font-size:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:60;background:#222438;border:1px solid var(--line);padding:12px 16px;border-radius:12px;display:none}
.hidden{display:none!important}

@media(max-width:1100px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.landscape-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){
  .topbar{display:none} /* Hide topbar on mobile to fully use bottom floating nav */
  .main{padding:12px 12px 90px}
  .hero{aspect-ratio:16/9;max-height:60vh;margin:5px 0 20px}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .landscape-grid{grid-template-columns:1fr}
  .page-head h1{font-size:26px}
  .detail-layout{grid-template-columns:105px minmax(0,1fr);gap:14px}
  .detail-hero{min-height:260px}
  .episode{grid-template-columns:120px minmax(0,1fr);gap:10px;padding:8px}
  
  /* Floating Pill Bottom Nav */
  .mobile-nav{
    display:flex;
    position:fixed;
    bottom:16px;
    left:50%;
    transform:translateX(-50%);
    z-index:100;
    align-items:center;
    background:rgba(19,21,33,0.85);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:40px;
    padding:6px 12px;
    gap:6px;
    box-shadow:0 10px 30px rgba(0,0,0,0.6);
  }
  .mobile-nav button{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    background:transparent;
    border:0;
    color:#9ba1b5;
    padding:8px 12px;
    border-radius:24px;
    font-size:10px;
    font-weight:600;
    cursor:pointer;
    transition:color .2s, background .2s;
  }
  .mobile-nav button.active{
    color:#fff;
    background:rgba(155,123,255,0.25);
  }
  .mobile-nav button span{
    font-size:16px;
  }
  .footer{padding-bottom:90px}
}
@media(max-width:390px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.episode{grid-template-columns:1fr}.episode img{max-height:190px}.detail-layout{grid-template-columns:85px minmax(0,1fr)}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <nav class="nav" aria-label="Main navigation">
    <button data-route="home">Home</button><button data-route="movie">Movies</button><button data-route="tv">TV Shows</button>
  </nav>
  <button class="search-icon" id="openSearch" type="button" aria-label="Open search" title="Search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 5 5"></path></svg></button>
</header>
<main id="appMain" class="main"><div class="loading">Loading CineScope…</div></main>
<nav class="mobile-nav" aria-label="Mobile navigation">
  <button data-route="home"><span>⌂</span>Home</button>
  <button data-route="movie"><span>▣</span>Movies</button>
  <button data-route="tv"><span>▤</span>TV</button>
  <button data-route="search"><span>🔍</span>Search</button>
</nav>
<footer class="footer">Movie and TV discovery powered by TMDB. This product uses the TMDB API but is not endorsed or certified by TMDB.</footer>
</div>
<div id="toast" class="toast" role="status"></div>
<script>
const TMDB_API_KEY = "0d516ae53b334d92b86cfc7c958d192f";
const API = "https://api.themoviedb.org/3";
const IMG = "https://image.tmdb.org/t/p/";
const PLACEHOLDER = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900"><rect width="600" height="900" fill="#191c2b"/><circle cx="300" cy="370" r="85" fill="#282b42"/><path d="M260 325h80v90h-80z" fill="#393d59"/><text x="300" y="520" fill="#9ba1b5" font-family="Arial" font-size="27" text-anchor="middle">NO IMAGE</text></svg>');
const state = {cache:new Map(), request:0, lastSearch:"", saved:JSON.parse(localStorage.getItem("cinescope-saved")||"[]"), heroItems:[], heroIndex:0, heroTimer:0, logoCache:new Map(), heroRenderToken:0};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function img(path,size="w342"){return path?IMG+size+path:PLACEHOLDER}
function date(v){if(!v)return "Release date TBA";const d=new Date(v+"T12:00:00");return Number.isNaN(+d)?"Date TBA":d.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"})}
function year(v){return v?String(v).slice(0,4):"TBA"}
function rating(v){return Number(v)>0?"★ "+Number(v).toFixed(1):"☆ NR"}
function mediaTitle(x){return x.title||x.name||"Untitled"}
function mediaDate(x){return x.release_date||x.first_air_date}
function mediaType(x){return x.media_type||(x.title?"movie":"tv")}
function apiUrl(path,params={}){const u=new URL(API+path);u.searchParams.set("api_key",TMDB_API_KEY);Object.entries(params).forEach(([k,v])=>{if(v!==undefined&&v!==null&&v!=="")u.searchParams.set(k,v)});return u}
async function api(path,params={}){const key=path+"?"+new URLSearchParams(params).toString();if(state.cache.has(key))return state.cache.get(key);const url=apiUrl(path,params);const r=await fetch(url);if(!r.ok){let msg="TMDB request failed ("+r.status+")";try{const j=await r.json();msg=j.status_message||msg}catch{}throw Error(msg)}const data=await r.json();state.cache.set(key,data);return data}
function setNav(route){document.querySelectorAll("[data-route]").forEach(b=>b.classList.toggle("active",b.dataset.route===route))}
function go(route,params={},replace=false){if(route==="search"){goSearchModal();return;}const url=new URL(location.href);url.hash=route+(Object.keys(params).length?"/"+encodeURIComponent(JSON.stringify(params)):"");if(replace)history.replaceState({route,params},"",url);else history.pushState({route,params},"",url);renderRoute(route,params)}
function goSearchModal(){go("search");}
function parseLocation(){let raw=location.hash.replace(/^#/,"");if(!raw)return {route:"home",params:{}};const slash=raw.indexOf("/");if(slash<0)return {route:raw||"home",params:{}};try{return {route:raw.slice(0,slash),params:JSON.parse(decodeURIComponent(raw.slice(slash+1)))}}catch{return {route:raw.slice(0,slash),params:{}}}}
function card(x,type){const t=type||mediaType(x),id=x.id;const name=mediaTitle(x);return `<article class="card" tabindex="0" role="button" aria-label="Open ${esc(name)}" data-open="${t}" data-id="${id}"><div class="poster-wrap"><img loading="lazy" src="${img(x.poster_path)}" alt="${esc(name)} poster" onerror="this.src=PLACEHOLDER"><span class="rating">${rating(x.vote_average)}</span></div><h3 title="${esc(name)}">${esc(name)}</h3><div class="meta">${year(mediaDate(x))} · ${t==="movie"?"Movie":"TV"}</div></article>`}
function cards(items,type){return items?.length?`<div class="grid">${items.map(x=>card(x,type)).join("")}</div>`:`<div class="empty">No titles found.</div>`}
function landscapeCard(x,type){return `<article class="land-card" tabindex="0" role="button" data-open="${type||mediaType(x)}" data-id="${x.id}"><img loading="lazy" src="${img(x.backdrop_path||x.poster_path,"w780")}" alt="${esc(mediaTitle(x))} landscape image" onerror="this.src=PLACEHOLDER"><div class="land-info"><h3>${esc(mediaTitle(x))}</h3><div class="meta">${date(mediaDate(x))} · ${rating(x.vote_average)}</div></div></article>`}
function section(title,items,type,land=false){return `<section class="section"><div class="section-title"><h2>${title}</h2><span>${items?.length||0} titles</span></div>${land?(items?.length?`<div class="landscape-grid">${items.map(x=>landscapeCard(x,type)).join("")}</div>`:`<div class="empty">No titles found.</div>`):cards(items,type)}</section>`}
function pageHead(title,sub){return `<div class="page-head"><div><div class="eyebrow">Discover something great</div><h1>${title}</h1><p class="sub">${sub}</p></div></div>`}
function errHtml(e){return `<div class="error"><b>Couldn't load TMDB data.</b><p>${esc(e.message)}</p><small>Check your API key, internet connection, and GitHub Pages URL.</small></div>`}

async function homePage(){
  const main=$("#appMain");
  main.innerHTML=`<div class="loading">Finding something to watch…</div>`;
  try{
    const [trending,movies,tvs,land]=await Promise.all([
      api("/trending/all/week",{language:"en-US"}),
      api("/movie/popular",{language:"en-US",page:1}),
      api("/tv/popular",{language:"en-US",page:1}),
      api("/movie/now_playing",{language:"en-US",page:1})
    ]);
    const mix=(trending.results||[]).filter(x=>["movie","tv"].includes(x.media_type));
    const hero=mix.find(x=>x.backdrop_path)||movies.results?.[0]||{};
    state.heroItems=mix.filter(x=>x.backdrop_path);
    state.heroIndex=Math.max(0,state.heroItems.findIndex(x=>x.id===hero.id));
    
    const type=mediaType(hero);
    main.innerHTML=`<section class="hero" id="homeHero" data-open="${type}" data-id="${hero.id}"><img class="hero-img" src="${img(hero.backdrop_path,"w1280")}" alt="" onerror="this.style.display='none'"><div class="hero-content"><div class="eyebrow">TRENDING THIS WEEK</div><div class="hero-title-slot" id="heroTitleSlot"><h2 class="hero-title-text">${esc(mediaTitle(hero))}</h2></div><div class="pills hero-meta"><span class="pill">${rating(hero.vote_average)}</span></div></div><div class="hero-nav-controls" onclick="event.stopPropagation()"><button class="hero-nav-btn" id="heroPrev" title="Previous">‹</button><button class="hero-nav-btn" id="heroNext" title="Next">›</button></div></section>${section("Trending now",mix.slice(0,12))}${section("Popular movies",movies.results,"movie")}${section("Popular TV shows",tvs.results,"tv")}${section("Now playing · Wide view",land.results,"movie",true)}`;
    
    updateHeroLogo(hero);
    startHeroCarousel();
    setupHeroControls();
  }catch(e){main.innerHTML=errHtml(e)}
}

async function getTmdbLogo(item){
  const type=mediaType(item),key=`${type}:${item.id}`;
  if(state.logoCache.has(key))return state.logoCache.get(key);
  try{
    const data=await api(`/${type}/${item.id}/images`);
    const logos=(data.logos||[]).filter(x=>x.file_path);
    const langPriority=["en",null,"en-US"];
    logos.sort((a,b)=>{
      const ai=langPriority.indexOf(a.iso_639_1),bi=langPriority.indexOf(b.iso_639_1);
      const ar=ai<0?langPriority.length:ai,br=bi<0?langPriority.length:bi;
      const transparentA=(a.file_path||"").toLowerCase().endsWith(".png")?0:1;
      const transparentB=(b.file_path||"").toLowerCase().endsWith(".png")?0:1;
      return ar-br||transparentA-transparentB||(b.vote_average||0)-(a.vote_average||0);
    });
    const logo=logos[0]?.file_path?img(logos[0].file_path,"w500"):null;
    state.logoCache.set(key,logo);return logo;
  }catch(e){state.logoCache.set(key,null);return null;}
}

async function updateHeroLogo(item){
  const token=++state.heroRenderToken;
  const slot=$("#heroTitleSlot");if(!slot)return;
  slot.innerHTML=`<h2 class="hero-title-text">${esc(mediaTitle(item))}</h2>`;
  const logo=await getTmdbLogo(item);
  if(token!==state.heroRenderToken||!$("#heroTitleSlot"))return;
  if(logo){
    const image=new Image();
    image.className="hero-title-logo";
    image.alt=mediaTitle(item);
    image.src=logo;
    image.onerror=()=>{if(token===state.heroRenderToken){const s=$("#heroTitleSlot");if(s)s.innerHTML=`<h2 class="hero-title-text">${esc(mediaTitle(item))}</h2>`;}};
    const slotNow=$("#heroTitleSlot");
    if(slotNow)slotNow.replaceChildren(image);
  }
}

function renderHeroItem(item){
  const hero=$("#homeHero");if(!hero||!item)return;
  const type=mediaType(item);
  const imgEl=hero.querySelector(".hero-img");
  imgEl.src=img(item.backdrop_path,"w1280");imgEl.alt="";
  imgEl.style.display="";
  const eyebrow=hero.querySelector(".eyebrow");if(eyebrow)eyebrow.textContent="TRENDING THIS WEEK";
  updateHeroLogo(item);
  const existing=hero.querySelector(".hero-meta");
  const meta=`<div class="pills hero-meta"><span class="pill">${rating(item.vote_average)}</span></div>`;
  if(existing)existing.outerHTML=meta;
  hero.dataset.open=type;
  hero.dataset.id=item.id;
}

function startHeroCarousel(){
  if(state.heroTimer)clearInterval(state.heroTimer);
  if(!state.heroItems||state.heroItems.length<2)return;
  state.heroTimer=setInterval(()=>{
    const hero=$("#homeHero");if(!hero)return;
    state.heroIndex=(state.heroIndex+1)%state.heroItems.length;
    renderHeroItem(state.heroItems[state.heroIndex]);
  },4000);
}

function setupHeroControls(){
  const prev=$("#heroPrev"), next=$("#heroNext");
  if(prev){
    prev.onclick=()=>{
      if(!state.heroItems.length)return;
      state.heroIndex=(state.heroIndex-1+state.heroItems.length)%state.heroItems.length;
      renderHeroItem(state.heroItems[state.heroIndex]);
      startHeroCarousel();
    };
  }
  if(next){
    next.onclick=()=>{
      if(!state.heroItems.length)return;
      state.heroIndex=(state.heroIndex+1)%state.heroItems.length;
      renderHeroItem(state.heroItems[state.heroIndex]);
      startHeroCarousel();
    };
  }
}

async function listPage(type){const main=$("#appMain"),isMovie=type==="movie",label=isMovie?"Movies":"TV Shows";main.innerHTML=`${pageHead(label,isMovie?"Popular films, new releases and audience ratings.":"Popular series, premiere dates and season guides.")}<div class="filters"><button class="active" data-list-mode="popular">Popular</button><button data-list-mode="trending">Trending</button><button data-list-mode="top">Top rated</button><button data-list-mode="upcoming">${isMovie?"Upcoming":"On the air"}</button></div><div id="listContent" class="loading">Loading ${label.toLowerCase()}…</div>`;await loadList(type,"popular")}
async function loadList(type,mode){const isMovie=type==="movie",path=mode==="trending"?`/trending/${type}/week`:mode==="top"?`/${type}/top_rated`:mode==="upcoming"?(isMovie?"/movie/upcoming":"/tv/on_the_air"):`/${type}/popular`;const content=$("#listContent");if(!content)return;content.innerHTML='<div class="loading">Loading titles…</div>';try{const d=await api(path,{language:"en-US",page:1});content.innerHTML=cards(d.results,type)}catch(e){content.innerHTML=errHtml(e)}}
async function searchPage(query=""){const main=$("#appMain");main.innerHTML=`${pageHead("Search","Find a movie, series, actor, or anything in the TMDB catalog.")}<div class="filters"><input id="pageSearch" type="search" value="${esc(query)}" placeholder="Search titles…" style="min-width:min(100%,320px);flex:1;background:var(--panel);border:1px solid var(--line);color:white;border-radius:10px;padding:11px 13px"><button id="searchSubmit" class="active">Search</button></div><div id="searchContent">${query?'<div class="loading">Searching…</div>':'<div class="empty">Start typing a title above. Movies and TV shows are searched together.</div>'}</div>`;if(query)await runSearch(query)}
async function runSearch(q){const content=$("#searchContent");if(!content)return;content.innerHTML='<div class="loading">Searching movies and TV shows…</div>';try{const d=await api("/search/multi",{query:q,include_adult:false,language:"en-US",page:1});const results=(d.results||[]).filter(x=>["movie","tv"].includes(x.media_type));content.innerHTML=`<div class="section-title"><h2>Results for “${esc(q)}”</h2><span>${results.length} results on this page</span></div>${cards(results)}`}catch(e){content.innerHTML=errHtml(e)}}
async function detailPage(type,id){const main=$("#appMain");main.innerHTML='<div class="loading">Loading details…</div>';try{const d=await api(`/${type}/${id}`,{language:"en-US",append_to_response:type==="tv"?"credits,external_ids":"credits,release_dates"});const title=mediaTitle(d),dateVal=type==="movie"?d.release_date:d.first_air_date;main.innerHTML=`<button class="backbtn" id="detailBack">← Back</button><section class="detail-hero"><img src="${img(d.backdrop_path,"w1280")}" alt="" onerror="this.style.display='none'"><div class="detail-copy"><div class="eyebrow">${type==="movie"?"Movie":"TV Series"} · ${year(dateVal)}</div><h1>${esc(title)}</h1><div class="pills"><span class="pill">${rating(d.vote_average)} (${d.vote_count||0} votes)</span><span class="pill">${type==="movie"?"Release":"First air"}: ${date(dateVal)}</span>${d.runtime?`<span class="pill">${d.runtime} min</span>`:""}${d.number_of_seasons?`<span class="pill">${d.number_of_seasons} seasons</span>`:""}</div><p class="overview">${esc(d.overview||"No overview available.")}</p><div class="pills">${(d.genres||[]).map(g=>`<span class="pill">${esc(g.name)}</span>`).join("")}</div></div></section><div class="detail-layout"><aside><img class="detail-poster" src="${img(d.poster_path,"w342")}" alt="${esc(title)} poster" onerror="this.src=PLACEHOLDER"></aside><section><div class="section-title"><h2>About</h2></div><p class="overview">${esc(d.overview||"No overview available.")}</p><p class="meta">Original language: ${(d.original_language||"—").toUpperCase()} · Status: ${esc(d.status||"Unknown")}</p>${type==="tv"?`<section class="section"><div class="section-title"><h2>Season guide</h2><span>${d.seasons?.length||0} seasons</span></div><label for="seasonSelect" class="meta">Choose a season</label><br><select id="seasonSelect" class="season-select">${(d.seasons||[]).map(s=>`<option value="${s.season_number}">${esc(s.name)} · ${s.episode_count||0} episodes</option>`).join("")}</select><div id="episodes" class="episode-list"></div></section>`:""}<section class="section"><h2>More details</h2><p class="meta">Popularity: ${Number(d.popularity||0).toFixed(1)} · Vote average: ${rating(d.vote_average)}</p></section></section></div>`;$("#detailBack").onclick=()=>history.back();if(type==="tv"&&d.seasons?.length){const sel=$("#seasonSelect");const valid=d.seasons.find(s=>s.season_number>0)||d.seasons[0];sel.value=String(valid.season_number);loadEpisodes(id,valid.season_number);sel.onchange=()=>loadEpisodes(id,Number(sel.value))}}catch(e){main.innerHTML=`<button class="backbtn" id="detailBack">← Back</button>${errHtml(e)}`;$("#detailBack").onclick=()=>history.back()}}
async function loadEpisodes(id,season){const box=$("#episodes");if(!box)return;box.innerHTML='<div class="loading">Loading episodes…</div>';try{const d=await api(`/tv/${id}/season/${season}`,{language:"en-US"});box.innerHTML=d.episodes?.length?d.episodes.map(ep=>`<article class="episode"><img loading="lazy" src="${img(ep.still_path,"w500")}" alt="${esc(ep.name)} thumbnail" onerror="this.src=PLACEHOLDER"><div><div class="eyebrow">Episode ${ep.episode_number}</div><h3>${esc(ep.name||"Untitled episode")}</h3><div class="pills"><span class="pill">${date(ep.air_date)}</span><span class="pill">${rating(ep.vote_average)}</span>${ep.runtime?`<span class="pill">${ep.runtime} min</span>`:""}</div><p>${esc(ep.overview||"No episode description available.")}</p></div></article>`).join(""):'<div class="empty">No episode details are available for this season.</div>'}catch(e){box.innerHTML=errHtml(e)}}
async function renderRoute(route,params={}){if(state.heroTimer){clearInterval(state.heroTimer);state.heroTimer=0;}setNav(route==="detail"?"":route);if(route==="home")return homePage();if(route==="list")return listPageSaved();if(route==="movie"||route==="tv")return listPage(route);if(route==="search")return searchPage(params.q||"");if(route==="detail")return detailPage(params.type||"movie",params.id);return go("home",{},true)}
async function listPageSaved(){const main=$("#appMain");main.innerHTML=`${pageHead("My List","Your saved movies and shows on this device.")}${state.saved.length?cards(state.saved):'<div class="empty">Your list is empty. Open a title and add it to your list.</div>'}`;}

document.addEventListener("click",e=>{
  const nav=e.target.closest("[data-route]");
  if(nav){e.preventDefault();go(nav.dataset.route);return}
  const open=e.target.closest("[data-open]");
  if(open){go("detail",{type:open.dataset.open,id:open.dataset.id});return}
  const mode=e.target.closest("[data-list-mode]");
  if(mode){document.querySelectorAll("[data-list-mode]").forEach(b=>b.classList.toggle("active",b===mode));const r=parseLocation();loadList(r.route,mode.dataset.listMode);return}
  if(e.target.id==="searchSubmit"){const q=$("#pageSearch")?.value.trim();if(q){const url=new URL(location.href);url.hash="search/"+encodeURIComponent(JSON.stringify({q}));history.pushState({route:"search",params:{q}},"",url);runSearch(q)}}
});

document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-open]")){e.preventDefault();e.target.click()}if(e.key==="Enter"&&e.target.id==="pageSearch")$("#searchSubmit")?.click()});
$("#openSearch").addEventListener("click",()=>go("search"));
window.addEventListener("popstate",()=>{const x=history.state;if(x?.route)renderRoute(x.route,x.params||{});else{const p=parseLocation();renderRoute(p.route,p.params)}});
window.addEventListener("hashchange",()=>{const p=parseLocation();if(!history.state?.route||history.state.route!==p.route)renderRoute(p.route,p.params)});
const initial=parseLocation();if(!location.hash){history.replaceState({route:"home",params:{}},"",location.pathname+location.search+"#home");renderRoute("home",{})}else{history.replaceState({route:initial.route,params:initial.params},"",location.href);renderRoute(initial.route,initial.params)}
</script>
</body>
</html>
